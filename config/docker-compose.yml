services:
  backend:
    build:
      context: ../axb_back
      dockerfile: ../config/Dockerfile
    image: anxingban-backend:latest
    container_name: anx-back
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # 必需的环境变量，使用 :? 语法在缺失时快速失败
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required. Copy .env.example to .env and configure it.}
      - TOKEN_SECRET=${TOKEN_SECRET:?TOKEN_SECRET is required. Copy .env.example to .env and configure it.}
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - anxingban-network

networks:
  anxingban-network:
    driver: bridge
