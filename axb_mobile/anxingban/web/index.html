<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="为长辈定制的智慧旅游助手">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="安行伴">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>安行伴 - 智慧旅游助手</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
      background: #0b1020;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 10%, #24499b 0%, transparent 38%),
        radial-gradient(circle at 90% 22%, #23abc9 0%, transparent 30%),
        radial-gradient(circle at 50% 100%, #332a83 0%, transparent 36%),
        #0b1020;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    .loader {
      text-align: center;
      color: #eaf2ff;
    }

    .logo {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #77cbff, #3b86d6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(119, 203, 255, 0.2);
      border-top-color: #77cbff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .loading-text {
      font-size: 14px;
      color: #bfd0ea;
      letter-spacing: 0.1em;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Prevent iOS bounce effect */
    html,
    body {
      position: fixed;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="loading">
    <div class="loader">
      <div class="logo">安行伴</div>
      <div class="spinner"></div>
      <div class="loading-text">加载中...</div>
    </div>
  </div>

  <script>
    // Hide loading screen when Flutter is ready
    window.addEventListener('flutter-first-frame', function () {
      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      loading.style.transition = 'opacity 0.3s ease';
      setTimeout(() => loading.remove(), 300);
    });

    // Prevent zoom gestures on iOS
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    document.addEventListener('touchmove', function (e) {
      if (e.scale !== 1) {
        e.preventDefault();
      }
    }, { passive: false });

    // Prevent pull-to-refresh
    let lastTouchY = 0;
    document.addEventListener('touchstart', function (e) {
      lastTouchY = e.touches[0].clientY;
    });

    document.addEventListener('touchmove', function (e) {
      const touchY = e.touches[0].clientY;
      const touchYDelta = touchY - lastTouchY;
      lastTouchY = touchY;

      if (window.scrollY === 0 && touchYDelta > 0) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
